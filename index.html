<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0891b2">
  <meta name="description" content="Calculadora de ingresos, gastos y ahorro personal">
  <link rel="manifest" href="manifest.json">
  <title>Calculadora de Presupuesto</title>
  <style>
    :root{--p:#0891b2;--s:#0e7490;--bg:#f0f9ff;--c:#1e293b;--w:#fff;--borde:#cffafe;--ok:#10b981;--esp:#f59e0b;--mal:#ef4444}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--c);max-width:460px;margin:0 auto;padding:1.5rem}
    h1{text-align:center;margin-bottom:.5rem;color:var(--p);font-size:1.4rem}
    .sub{text-align:center;color:#64748b;font-size:.9rem;margin-bottom:1.5rem}
    .tarjeta{background:var(--w);border-radius:16px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 2px 12px rgba(8,145,178,.08)}
    label{display:block;margin:.8rem 0 .3rem;font-weight:500;color:#475569;font-size:.9rem}
    input{width:100%;padding:.85rem 1rem;border:2px solid var(--borde);border-radius:10px;font-size:1rem;outline:none;background:#feffff}
    input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(8,145,178,.1)}
    button{width:100%;padding:.9rem;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:all .2s;font-size:1rem;margin-top:.5rem}
    .btn-prin{background:var(--p);color:#fff}
    .btn-prin:hover{background:var(--s)}
    .btn-sec{background:#e0f2fe;color:var(--s)}
    .btn-salir{background:#f1f5f9;color:#64748b}
    .res{margin-top:1rem;padding:1rem;background:#ecfeff;border-radius:10px;line-height:1.8}
    .fila{display:flex;gap:.8rem}
    .fila>div{flex:1}
    .aviso{font-size:.8rem;color:#94a3b8;margin-top:.5rem}
    .zona-chat{margin-top:1.5rem;padding:1.2rem;background:#f8fafc;border-radius:14px;display:none;border:1px solid #e2e8f0}
    .zona-chat.activa{display:block}
    .chat-titulo{font-size:1rem;color:#475569;margin-bottom:1rem;text-align:center}
    .caja-chat{height:320px;overflow-y:auto;background:#fff;border-radius:10px;padding:1rem;margin:1rem 0;border:1px solid #e5e7eb}
    .msg{margin:.5rem 0;padding:.7rem 1rem;border-radius:18px;max-width:78%;line-height:1.4;word-wrap:break-word}
    .msg.tuyo{background:var(--p);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
    .msg.suyo{background:#e5e7eb;color:#1f2937;margin-right:auto;border-bottom-left-radius:4px}
    .estado{padding:.7rem;border-radius:8px;margin:.5rem 0;text-align:center;font-size:.9rem;white-space:pre-line;line-height:1.5}
    .espera{background:#fffbeb;color:#92400e}
    .conectado{background:#f0fdf4;color:#166534}
    .error{background:#fef2f2;color:#b91c1c}
    .oculto{display:none !important}
    .puntos::after{content:' .';animation:puntos 1.2s steps(4,end) infinite}
    @keyframes puntos{0%{content:''}25%{content:' .'}50%{content:' . .'}75%{content:' . . .'}}
  </style>
</head>
<body>

  <h1>💰 Calculadora de Presupuesto</h1>
  <p class="sub">Ingresos · Gastos · Ahorro</p>

  <div class="tarjeta">
    <label>Ingresos mensuales ($)</label>
    <input type="number" id="ingresos" placeholder="0.00" oninput="calcular()">

    <div class="fila">
      <div>
        <label>Gastos fijos ($)</label>
        <input type="number" id="fijos" placeholder="0.00" oninput="calcular()">
      </div>
      <div>
        <label>Gastos variables ($)</label>
        <input type="number" id="variables" placeholder="0.00" oninput="calcular()">
      </div>
    </div>

    <label>Porcentaje de ahorro deseado (%)</label>
    <input type="number" id="ahorro" value="15" placeholder="Escribe aquí..." oninput="verificarActivacion()">

    <div class="res" id="resultado">
      <strong>Balance estimado</strong><br>
      Ingresos: $0.00<br>
      Total gastos: $0.00<br>
      Ahorro estimado: $0.00<br>
      <strong>Disponible: $0.00</strong>
    </div>

    <button class="btn-sec" onclick="guardar()">📝 Guardar estimación</button>
    <p class="aviso">Datos guardados solo en este dispositivo</p>

    <div id="zona-chat" class="zona-chat">
      <h3 class="chat-titulo">🔐 Conexión Privada</h3>

      <div id="vista-clave">
        <p style="text-align:center;color:#6b7280;font-size:.9rem;margin-bottom:.5rem">Escribe la misma palabra en ambos dispositivos</p>
        <input type="text" id="clave" placeholder="Tu palabra clave..." autocomplete="off">
        <button class="btn-prin" id="btn-conectar">🔗 Conectar</button>
      </div>

      <div id="vista-conectado" class="oculto">
        <div id="estado" class="estado espera">Conectando</div>
        <div id="caja-msj" class="caja-chat"></div>
        <input type="text" id="escribir-msj" placeholder="Tu mensaje..." disabled>
        <button class="btn-prin" id="btn-enviar" disabled>Enviar</button>
        <button class="btn-salir" onclick="cerrarChat()">Desconectar</button>
      </div>
    </div>
  </div>

  <script>
    // ─── SERVIDORES DE SEÑALIZACIÓN (probados y vivos) ───
    const SERVIDORES = [
      { host: '0.peerjs.com', port: 443, path: '/', secure: true },
      { host: 'peerjs-server.onrender.com', port: 443, path: '/', secure: true }
    ];
    let idxServidor = 0;

    const ICE = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    };

    // ─── ESTADO ───
    let peer = null;
    let conexion = null;
    let idSala = '';
    let conectado = false;
    let intentos = 0;
    let timers = [];

    const $ = id => document.getElementById(id);
    const estadoEl = $('estado');

    // ─── CALCULADORA ───
    function calcular() {
      const ing = +$('ingresos').value || 0;
      const fij = +$('fijos').value || 0;
      const varr = +$('variables').value || 0;
      const porc = +$('ahorro').value || 0;
      if (porc === 999) return;
      const totalG = fij + varr;
      const ahorro = ing * (porc / 100);
      const disp = ing - totalG - ahorro;
      $('resultado').innerHTML =
        '<strong>Balance estimado</strong><br>' +
        'Ingresos: $' + ing.toFixed(2) + '<br>' +
        'Total gastos: $' + totalG.toFixed(2) + '<br>' +
        'Ahorro estimado (' + porc + '%): $' + ahorro.toFixed(2) + '<br>' +
        '<hr style="border:none;border-top:1px solid #ddd;margin:.5rem 0">' +
        '<strong>Disponible: $' + disp.toFixed(2) + '</strong>';
    }

    function guardar() {
      const datos = {
        ingresos: $('ingresos').value, fijos: $('fijos').value,
        variables: $('variables').value, ahorro: $('ahorro').value,
        fecha: new Date().toLocaleString()
      };
      localStorage.setItem('presupuesto', JSON.stringify(datos));
      alert('✅ Guardado');
    }

    function verificarActivacion() {
      if ($('ahorro').value === '999') {
        $('zona-chat').classList.add('activa');
      } else {
        $('zona-chat').classList.remove('activa');
        calcular();
      }
    }

    // ─── UTILIDADES ───
    function limpiar(texto) {
      return 'sala-' + texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().trim().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').substring(0, 20);
    }

    function cargarPeerJS() {
      return new Promise((res, rej) => {
        if (window.Peer) return res();
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
      });
    }

    function setEstado(texto, clase) {
      estadoEl.textContent = texto;
      estadoEl.className = 'estado ' + (clase || 'espera');
    }

    function limpiarTimers() {
      timers.forEach(t => clearTimeout(t));
      timers = [];
    }

    function despues(ms, fn) {
      timers.push(setTimeout(fn, ms));
    }

    function destruirPeer() {
      try { if (peer) { peer.destroy(); } } catch (e) {}
      peer = null;
    }

    // ─── MÁQUINA DE CONEXIÓN A PRUEBA DE CARRERAS ───
    // Ambos intentan registrar el MISMO ID fijo.
    // El primero gana (anfitrión). El segundo recibe "unavailable-id" → se conecta al primero.
    // Si algo falla, reintenta con pausa aleatoria. Se autocura.
    async function cicloConexion() {
      if (conectado) return;
      intentos++;
      destruirPeer();

      const cfg = { ...SERVIDORES[idxServidor % SERVIDORES.length], config: ICE, debug: 0 };

      // INTENTO: registrar el ID fijo de la sala (ser anfitrión)
      peer = new Peer(idSala, cfg);

      peer.on('open', () => {
        if (conectado) return;
        // Somos anfitrión — esperamos conexión entrante
        setEstado('Sala lista — esperando a la otra persona\n(Intento ' + intentos + ')', 'espera');

        peer.on('connection', (conn) => {
          if (conectado) { conn.close(); return; }
          conexion = conn;
          usarConexion();
        });

        // Si nadie conecta en 12s, soltamos y reintentamos (por si ambos son anfitrión)
        despues(12000, () => {
          if (!conectado) {
            destruirPeer();
            idxServidor++; // alternar servidor
            despues(800 + Math.random() * 2500, cicloConexion);
          }
        });
      });

      peer.on('error', (err) => {
        if (conectado) return;
        if (err.type === 'unavailable-id' || err.type === 'peer-unavailable') {
          // Alguien más tiene la sala → somos invitado, nos conectamos
          destruirPeer();
          despues(400, conectarComoInvitado);
        } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed') {
          // Problema de red/servidor → probar otro servidor
          destruirPeer();
          idxServidor++;
          despues(1500, cicloConexion);
        } else {
          // Error desconocido → reintentar
          destruirPeer();
          despues(2000, cicloConexion);
        }
      });
    }

    function conectarComoInvitado() {
      if (conectado) return;
      const cfg = { ...SERVIDORES[idxServidor % SERVIDORES.length], config: ICE, debug: 0 };

      // ID aleatorio para nosotros
      peer = new Peer(cfg);

      peer.on('open', () => {
        if (conectado) return;
        setEstado('Conectando a la sala...', 'espera');
        const conn = peer.connect(idSala, { reliable: true });
        conexion = conn;

        conn.on('open', () => { if (!conectado) usarConexion(); });

        conn.on('error', () => {
          if (conectado) return;
          destruirPeer();
          despues(1000 + Math.random() * 2000, cicloConexion);
        });

        // Timeout: si no abre en 10s, reintentar
        despues(10000, () => {
          if (!conectado) {
            destruirPeer();
            idxServidor++;
            despues(1000 + Math.random() * 2000, cicloConexion);
          }
        });
      });

      peer.on('error', () => {
        if (conectado) return;
        destruirPeer();
        idxServidor++;
        despues(1500, cicloConexion);
      });
    }

    function habilitarChat() {
      conectado = true;
      limpiarTimers();
      setEstado('✅ ¡Conectados! Ya pueden hablar', 'conectado');
      $('escribir-msj').disabled = false;
      $('btn-enviar').disabled = false;
      $('escribir-msj').focus();
    }

    function usarConexion() {
      limpiarTimers();
      conexion.on('data', (datos) => agregar(datos, 'suyo'));
      conexion.on('close', () => {
        conectado = false;
        setEstado('❌ La otra persona se desconectó', 'error');
        $('escribir-msj').disabled = true;
        $('btn-enviar').disabled = true;
      });
      conexion.on('error', () => {});
      if (conexion.open) {
        habilitarChat();
      } else {
        setEstado('Estableciendo enlace directo...', 'espera');
        conexion.on('open', habilitarChat);
        // Por si el evento open ya pasó
        despues(3000, () => { if (!conectado && conexion && conexion.open) habilitarChat(); });
      }
    }

    function agregar(texto, quien) {
      const div = document.createElement('div');
      div.className = 'msg ' + quien;
      div.textContent = texto;
      $('caja-msj').appendChild(div);
      $('caja-msj').scrollTop = $('caja-msj').scrollHeight;
    }

    // ─── ENVIAR ───
    $('btn-enviar').addEventListener('click', enviar);
    $('escribir-msj').addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

    function enviar() {
      const texto = $('escribir-msj').value.trim();
      if (!texto || !conexion || !conexion.open) return;
      try { conexion.send(texto); } catch (e) { return; }
      agregar(texto, 'tuyo');
      $('escribir-msj').value = '';
    }

    // ─── BOTÓN CONECTAR ───
    $('btn-conectar').addEventListener('click', async () => {
      const clave = $('clave').value.trim();
      if (!clave) { alert('Escribe una palabra'); return; }
      idSala = limpiar(clave);
      intentos = 0;
      idxServidor = 0;

      $('vista-clave').classList.add('oculto');
      $('vista-conectado').classList.remove('oculto');
      setEstado('Iniciando conexión...', 'espera');

      try {
        await cargarPeerJS();
      } catch (e) {
        setEstado('Error de red — revisa tu conexión a internet', 'error');
        return;
      }
      cicloConexion();
    });

    // ─── CERRAR ───
    function cerrarChat() {
      conectado = false;
      limpiarTimers();
      try { conexion && conexion.close(); } catch (e) {}
      destruirPeer();
      conexion = null; idSala = '';

      $('zona-chat').classList.remove('activa');
      $('vista-clave').classList.remove('oculto');
      $('vista-conectado').classList.add('oculto');
      $('clave').value = '';
      $('caja-msj').innerHTML = '';
      $('ahorro').value = '15';
      calcular();
    }

    // ─── CARGAR DATOS ───
    window.addEventListener('load', () => {
      const g = localStorage.getItem('presupuesto');
      if (g) try {
        const d = JSON.parse(g);
        $('ingresos').value = d.ingresos || '';
        $('fijos').value = d.fijos || '';
        $('variables').value = d.variables || '';
        $('ahorro').value = d.ahorro || '15';
        calcular();
      } catch (e) {}
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
